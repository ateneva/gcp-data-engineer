stream_id: "sakila-to-bq-critical-stream"
display_name: "Sakila -> BigQuery"
location: "europe-west1"
desired_state: "RUNNING"

source:
  database: "sakila"
  tables:
    - "customer"
    - "payment"

destination:
  dataset_id: "projects/data-geeking-gcp/datasets/sakila_streaming"
  write_mode: "append" # Change to "merge" if you want standard upserts/deletes

backfill:
  enabled: true # Set to false if you want to skip historical backfill completely
