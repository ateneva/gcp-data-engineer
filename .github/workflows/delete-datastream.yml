name: Delete Datastream

on:
  workflow_dispatch:
    inputs:
      stream_id:
        description: Datastream stream ID to delete
        required: true
        type: string
      confirm_stream_id:
        description: Re-enter the stream ID to confirm deletion
        required: true
        type: string
      location:
        description: GCP region where the stream is configured
        required: true
        default: europe-west1
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  delete-stream:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: data-geeking-gcp
      STREAM_ID: ${{ inputs.stream_id }}
      CONFIRM_STREAM_ID: ${{ inputs.confirm_stream_id }}
      LOCATION: ${{ inputs.location }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Confirm stream ID
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STREAM_ID" != "$CONFIRM_STREAM_ID" ]]; then
            echo "Error: confirmation does not match the stream ID; refusing to delete." >&2
            exit 1
          fi

      - name: Check secret availability
        run: |
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "Error: GCP_WORKLOAD_IDENTITY_PROVIDER secret is missing or empty!" >&2
            exit 1
          fi
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "Error: GCP_SERVICE_ACCOUNT secret is missing or empty!" >&2
            exit 1
          fi
          echo "Secrets are present."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Delete stream
        shell: bash
        run: |
          set -euo pipefail
          gcloud datastream streams delete "$STREAM_ID" \
            --location="$LOCATION" \
            --project="$GCP_PROJECT_ID" \
            --quiet
