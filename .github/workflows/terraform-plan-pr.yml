name: Terraform plan on PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  GCP_PROJECT_ID: data-geeking-gcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  terraform-plan:
    name: Run terraform plan for changed Terraform directories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed Terraform files
        id: find_tf
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('has_changes', 'false');
              core.setOutput('dirs', '');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number });
            const tfFiles = files.filter(f => f.filename.match(/\.(tf|tfvars|tf.json)$/));
            const dirs = [...new Set(tfFiles.map(f => {
              const idx = f.filename.lastIndexOf('/');
              return idx === -1 ? '.' : f.filename.slice(0, idx);
            }))];
            core.setOutput('has_changes', dirs.length ? 'true' : 'false');
            core.setOutput('dirs', dirs.join('\n'));

      - name: Skip if no Terraform changes
        if: steps.find_tf.outputs.has_changes == 'false'
        run: |
          echo "No Terraform changes detected in this PR. Exiting."

      - name: Setup Terraform
        if: steps.find_tf.outputs.has_changes == 'true'
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.15.8'

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Run terraform plan(s) and build summary
        if: steps.find_tf.outputs.has_changes == 'true'
        id: plan
        env:
          TERRAFORM_DIRS: ${{ steps.find_tf.outputs.dirs }}
        run: |
          set -euo pipefail
          echo "Preparing plan summary..."
          SUMMARY_FILE="${GITHUB_WORKSPACE:-.}/plan-summary.md"
          echo "# Terraform plan summary for PR #${{ github.event.pull_request.number }}" > "$SUMMARY_FILE"
          echo "Repository: ${{ github.repository }}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "Installing jq (required for JSON parsing)..."
          sudo apt-get update -y
          sudo apt-get install -y jq

          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "Processing directory: '$dir'"
            echo "---" >> "$SUMMARY_FILE"
            echo "## Directory: $dir" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            pushd "$dir" > /dev/null || { echo "Failed to enter $dir"; echo "Failed to enter $dir" >> "$SUMMARY_FILE"; continue; }

            # Initialize (don't fail the whole job if init fails)
            terraform init -input=false -no-color > init.txt 2>&1 || { echo "terraform init failed in $dir (continuing)"; echo "terraform init failed in $dir — see init output below:" >> "$SUMMARY_FILE"; echo '```' >> "$SUMMARY_FILE"; cat init.txt >> "$SUMMARY_FILE"; echo '```' >> "$SUMMARY_FILE"; }

            # Create plan (allow failure so we can report it)
            PLAN_FILE="tfplan"
            PLAN_OUT="plan.txt"
            if terraform plan -input=false -no-color -out="$PLAN_FILE" > "$PLAN_OUT" 2>&1; then
              PLAN_EXIT_CODE=0
            else
              PLAN_EXIT_CODE=$?
              echo "**terraform plan failed (exit code $PLAN_EXIT_CODE).**" >> "$SUMMARY_FILE"
              echo '```' >> "$SUMMARY_FILE"
              cat "$PLAN_OUT" >> "$SUMMARY_FILE"
              echo '```' >> "$SUMMARY_FILE"
            fi

            if [ "$PLAN_EXIT_CODE" -ne 0 ]; then
              popd > /dev/null || true
              continue
            fi

            if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
              # Human-readable show
              terraform show -no-color "$PLAN_FILE" > show.txt 2>&1 || true

              # JSON show
              terraform show -json "$PLAN_FILE" > plan.json 2>&1 || true
            fi

            # Extract counts and resource lines using jq
            if [ -s plan.json ] && jq -e 'type == "object"' plan.json > /dev/null 2>&1; then
              create_count=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' plan.json)
              update_count=$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length' plan.json)
              delete_count=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' plan.json)
              replace_count=$(jq '[.resource_changes[]? | select((.change.actions | index("create")) and (.change.actions | index("delete")))] | length' plan.json)

              echo "**Summary:** $create_count to add, $update_count to change, $delete_count to destroy, $replace_count to replace" >> "$SUMMARY_FILE"

              echo "" >> "$SUMMARY_FILE"

              echo "<details><summary>Resource changes</summary>" >> "$SUMMARY_FILE"
              echo "" >> "$SUMMARY_FILE"
              jq -r '.resource_changes[]? | "- " + (if (.change.actions | index("create")) then "+" elif (.change.actions | index("delete")) then "-" elif (.change.actions | index("update")) then "~" else "?" end) + " `" + .address + "` (" + (.change.actions | join(",")) + ")"' plan.json >> "$SUMMARY_FILE" || true
              echo "" >> "$SUMMARY_FILE"
              echo "</details>" >> "$SUMMARY_FILE"

              echo "<details><summary>Full plan output</summary>" >> "$SUMMARY_FILE"
              echo '' >> "$SUMMARY_FILE"
              echo '```' >> "$SUMMARY_FILE"
              cat show.txt >> "$SUMMARY_FILE" || true
              echo '```' >> "$SUMMARY_FILE"
              echo "" >> "$SUMMARY_FILE"
              echo "</details>" >> "$SUMMARY_FILE"
            else
              echo "No valid plan.json for $dir; terraform plan or terraform show may have failed." >> "$SUMMARY_FILE"
              if [ -s plan.txt ]; then
                echo "" >> "$SUMMARY_FILE"
                echo "<details><summary>Plan stdout/stderr</summary>" >> "$SUMMARY_FILE"
                echo '```' >> "$SUMMARY_FILE"
                cat plan.txt >> "$SUMMARY_FILE"
                echo '```' >> "$SUMMARY_FILE"
                echo "</details>" >> "$SUMMARY_FILE"
              fi
              if [ -s show.txt ]; then
                echo "" >> "$SUMMARY_FILE"
                echo "<details><summary>Terraform show output</summary>" >> "$SUMMARY_FILE"
                echo '```' >> "$SUMMARY_FILE"
                cat show.txt >> "$SUMMARY_FILE"
                echo '```' >> "$SUMMARY_FILE"
                echo "</details>" >> "$SUMMARY_FILE"
              fi
            fi

            popd > /dev/null || true
          done <<< "$TERRAFORM_DIRS"

          # Show summary to logs
          echo "---- PLAN SUMMARY ----"
          cat "$SUMMARY_FILE"
          echo "---- END SUMMARY ----"

          # Save path for next step
          echo "summary_path=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment with plan summary
        if: steps.find_tf.outputs.has_changes == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: ${{ steps.plan.outputs.summary_path }}
          edit-mode: replace
