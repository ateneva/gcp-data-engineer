name: Backfill Datastream object

on:
  workflow_dispatch:
    inputs:
      stream_id:
        description: Datastream stream ID
        required: true
        type: string
      object_id:
        description: Source table name (for example, customer)
        required: true
        type: string
      location:
        description: GCP region where the stream is configured
        required: true
        default: europe-west1
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  backfill-object:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: data-geeking-gcp
      STREAM_ID: ${{ inputs.stream_id }}
      OBJECT_ID: ${{ inputs.object_id }}
      LOCATION: ${{ inputs.location }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check secret availability
        run: |
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "Error: GCP_WORKLOAD_IDENTITY_PROVIDER secret is missing or empty!" >&2
            exit 1
          fi
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "Error: GCP_SERVICE_ACCOUNT secret is missing or empty!" >&2
            exit 1
          fi
          echo "Secrets are present."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Start object backfill
        shell: bash
        run: |
          set -euo pipefail

          access_token="$(gcloud auth print-access-token)"
          stream_name="projects/${GCP_PROJECT_ID}/locations/${LOCATION}/streams/${STREAM_ID}"
          objects_url="https://datastream.googleapis.com/v1/${stream_name}/objects"
          page_token=""
          object_names=()

          while true; do
            response="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              --get \
              --data-urlencode "pageSize=1000" \
              --data-urlencode "pageToken=${page_token}" \
              "$objects_url")"

            while IFS= read -r name; do
              object_names+=("$name")
            done < <(jq -r --arg table "$OBJECT_ID" \
              '.streamObjects[]? | select([.sourceObject | .. | objects | .table? // empty] | any(. == $table)) | .name' \
              <<< "$response")

            page_token="$(jq -r '.nextPageToken // empty' <<< "$response")"
            [[ -n "$page_token" ]] || break
          done

          if [[ "${#object_names[@]}" -eq 0 ]]; then
            echo "::error::No stream object with source table '${OBJECT_ID}' was found in '${stream_name}'. Check the stream and table name."
            exit 1
          fi

          if [[ "${#object_names[@]}" -gt 1 ]]; then
            printf '::error::More than one stream object has source table name "%s"; use a more specific stream. Matches:\n' "$OBJECT_ID" >&2
            printf '  %s\n' "${object_names[@]}" >&2
            exit 1
          fi

          object_name="${object_names[0]}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://datastream.googleapis.com/v1/${object_name}:startBackfillJob"

          echo "Backfill initiated for Datastream object '${object_name}'."
