name: Stop Cloud SQL

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Provide Cloud SQL instance ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  stop-instance:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: data-geeking-gcp
      INSTANCE_ID: ${{ inputs.instance_id }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check secret availability
        run: |
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "Error: GCP_WORKLOAD_IDENTITY_PROVIDER secret is missing or empty!" >&2
            exit 1
          fi
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "Error: GCP_SERVICE_ACCOUNT secret is missing or empty!" >&2
            exit 1
          fi
          echo "Secrets are present."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Stop Cloud SQL instance if running
        shell: bash
        run: |
          set -euo pipefail

          state="$(gcloud sql instances describe "$INSTANCE_ID" \
            --project="$GCP_PROJECT_ID" \
            --format='value(state)')"

          if [[ "$state" == "SUSPENDED" || "$state" == "STOPPED" ]]; then
            echo "Cloud SQL instance '$INSTANCE_ID' is already stopped."
            exit 0
          fi

          if [[ "$state" != "RUNNABLE" ]]; then
            echo "Cloud SQL instance '$INSTANCE_ID' is in state '$state'; expected 'RUNNABLE'." >&2
            exit 1
          fi

          gcloud sql instances patch "$INSTANCE_ID" \
            --project="$GCP_PROJECT_ID" \
            --activation-policy=NEVER

          for attempt in {1..90}; do
            state="$(gcloud sql instances describe "$INSTANCE_ID" \
              --project="$GCP_PROJECT_ID" \
              --format='value(state)')"
            if [[ "$state" == "SUSPENDED" || "$state" == "STOPPED" ]]; then
              echo "Cloud SQL instance '$INSTANCE_ID' is stopped."
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for Cloud SQL instance '$INSTANCE_ID' to stop (last state: '$state')." >&2
          exit 1
