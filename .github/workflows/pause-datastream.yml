name: Pause Datastream

on:
  workflow_dispatch:
    inputs:
      stream_id:
        description: Datastream stream ID
        required: true
        default: sakila-to-bq-stream
        type: string
      location:
        description: GCP region where the stream is configured
        required: true
        default: europe-west1
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  pause-stream:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: data-geeking-gcp
      STREAM_ID: ${{ inputs.stream_id }}
      LOCATION: ${{ inputs.location }}

    steps:
      - name: Validate Google Cloud identity configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$WIF_PROVIDER" ]]; then
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER as a repository variable or secret to the full Workload Identity Provider resource name."
            exit 1
          fi

          if [[ -z "$SERVICE_ACCOUNT" ]]; then
            echo "::error::Set GCP_SERVICE_ACCOUNT as a repository variable or secret to the GitHub Actions service account email."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Pause stream if running
        shell: bash
        run: |
          set -euo pipefail

          state="$(gcloud datastream streams describe "$STREAM_ID" \
            --location="$LOCATION" \
            --project="$GCP_PROJECT_ID" \
            --format='value(state)')"

          if [[ "$state" != "RUNNING" ]]; then
            echo "Stream '$STREAM_ID' is '$state'; no pause is needed."
            exit 0
          fi

          gcloud datastream streams update "$STREAM_ID" \
            --location="$LOCATION" \
            --project="$GCP_PROJECT_ID" \
            --state=PAUSED \
            --update-mask=state

          for attempt in {1..30}; do
            state="$(gcloud datastream streams describe "$STREAM_ID" \
              --location="$LOCATION" \
              --project="$GCP_PROJECT_ID" \
              --format='value(state)')"
            if [[ "$state" == "PAUSED" ]]; then
              echo "Stream '$STREAM_ID' is paused."
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for stream '$STREAM_ID' to pause (last state: '$state')." >&2
          exit 1
